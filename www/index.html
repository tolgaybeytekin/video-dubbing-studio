<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Video Dubbing Studio</title>
<style>
:root { --bg:#0f172a; --panel:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; --border:#334155; --coffee:#f59e0b; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; min-height:100vh; }
.wrap { max-width:600px; margin:0 auto; padding:16px; }
h1 { color:var(--accent); font-size:1.4rem; margin-bottom:4px; }
.sub { color:var(--muted); font-size:.85rem; margin-bottom:12px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:12px; }
label { display:block; color:var(--muted); font-size:.85rem; margin-bottom:4px; }
input,select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px; font-size:.9rem; margin-bottom:8px; }
button { width:100%; background:var(--accent); color:#0f172a; border:none; border-radius:8px; padding:10px; font-weight:700; font-size:.95rem; cursor:pointer; margin-bottom:8px; }
button.secondary { background:var(--panel); color:var(--text); border:1px solid var(--border); }
button:disabled { opacity:.5; }
.progress { height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin:8px 0; }
.progress > div { height:100%; background:var(--accent); width:0%; transition:width .3s; }
.log { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px; height:180px; overflow:auto; font-family:monospace; font-size:.75rem; white-space:pre-wrap; }
.status { color:var(--accent); font-weight:600; margin:6px 0; }
a.link { color:var(--accent); }
.coffee-btn { background:var(--coffee); color:#1a1200; font-weight:700; }
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:1000; }
.modal { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; max-width:360px; width:90%; }
.modal h2 { color:var(--coffee); margin-bottom:6px; }
.modal p { color:var(--muted); font-size:.9rem; margin-bottom:10px; }
.addr { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px; font-family:monospace; font-size:.75rem; word-break:break-all; margin-bottom:8px; }
.modal-actions { display:flex; gap:8px; margin-top:8px; }
.modal-actions button { flex:1; }
.warn { color:#f87171; font-size:.8rem; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Video Dubbing Studio</h1>
  <p class="sub">Backend URL'yi kaydedin. Harici sunucu gerekir.</p>

  <div class="card">
    <label>Backend URL</label>
    <input id="backendUrl" placeholder="http://192.168.1.X:8000" />
    <button onclick="saveBackend()">Kaydet</button>
  </div>

  <div class="card">
    <label>Video URL</label>
    <input id="videoUrl" placeholder="https://..." />
    <label>Galeriden Video Seç</label>
    <input id="videoFile" type="file" accept="video/*" />
    <label>Kaynak Dil (auto/ISO)</label>
    <input id="srcLang" value="auto" />
    <label>Hedef Dil</label>
    <input id="tgtLang" value="tr" />
    <label>Whisper Model</label>
    <select id="modelSize">
      <option value="tiny">tiny</option>
      <option value="base">base</option>
      <option value="small" selected>small</option>
      <option value="medium">medium</option>
    </select>
    <label>TTS Voice</label>
    <input id="ttsVoice" value="tr-TR-AhmetNeural" />
    <button onclick="startJob()">Start Dubbing</button>
  </div>

  <div class="card">
    <div class="status" id="status">Idle</div>
    <div class="progress"><div id="bar"></div></div>
    <div class="log" id="log"></div>
    <a id="downloadLink" class="link" style="display:none" target="_blank">Download result</a>
  </div>

  <div class="card">
    <button class="coffee-btn" onclick="openCoffee()">☕ Buy Me a Coffee (2 USDT)</button>
  </div>
</div>

<div class="modal-backdrop" id="coffeeModal">
  <div class="modal">
    <h2>Support Development (2 USDT)</h2>
    <p>Send 2 USDT via BNB Smart Chain (BEP20)</p>
    <div class="addr" id="addr">0x93872BdE7652373c87Afd53b6659054cCAb060D2</div>
    <div class="modal-actions">
      <button onclick="copyAddr()">Copy Address</button>
      <a href="ethereum:0x55d398326f99059fF775485246999027B3197955@56/transfer?address=0x93872BdE7652373c87Afd53b6659054cCAb060D2&uint256=2e18" style="flex:1;text-decoration:none;">
        <button style="width:100%">Open in Crypto Wallet</button>
      </a>
    </div>
    <div id="copyMsg" style="color:#4ade80;font-size:.8rem;margin-top:6px;display:none;">Copied!</div>
    <div class="warn">Network: BNB Smart Chain (BEP20) only.</div>
    <button class="secondary" onclick="closeCoffee()" style="margin-top:10px;">Close</button>
  </div>
</div>

<script>
function getBackend(){ return (localStorage.getItem('backendUrl') || document.getElementById('backendUrl').value || '').trim(); }
function saveBackend(){ const v=document.getElementById('backendUrl').value.trim(); localStorage.setItem('backendUrl', v); log('Backend URL saved: '+v); }
window.addEventListener('DOMContentLoaded', ()=>{ const v=localStorage.getItem('backendUrl'); if(v){ document.getElementById('backendUrl').value=v; } });

function log(m){ const l=document.getElementById('log'); l.textContent += m + "\n"; l.scrollTop=l.scrollHeight; }
function openCoffee(){ document.getElementById('coffeeModal').style.display='flex'; }
function closeCoffee(){ document.getElementById('coffeeModal').style.display='none'; }
function copyAddr(){
  const t=document.getElementById('addr').textContent;
  navigator.clipboard.writeText(t).then(()=>{ const m=document.getElementById('copyMsg'); m.style.display='block'; setTimeout(()=>m.style.display='none',1500); });
}

async function startJob(){
  const api=getBackend();
  if(!api){ log('Backend URL girin'); return; }
  const url=document.getElementById('videoUrl').value.trim();
  const fileInput=document.getElementById('videoFile');
  if(!url && !fileInput.files.length){ log('URL veya dosya girin'); return; }
  const form=new FormData();
  if(url) form.append('video_url', url);
  if(fileInput.files.length) form.append('video_file', fileInput.files[0]);
  form.append('source_lang', document.getElementById('srcLang').value.trim());
  form.append('target_lang', document.getElementById('tgtLang').value.trim());
  form.append('whisper_model', document.getElementById('modelSize').value);
  form.append('tts_voice', document.getElementById('ttsVoice').value.trim());
  log('İş gönderiliyor...');
  document.getElementById('bar').style.width='30%';
  try {
    const res=await fetch(api+'/dub',{method:'POST',body:form});
    const data=await res.json();
    document.getElementById('bar').style.width='100%';
    if(data.error){ log('Hata: '+data.error); return; }
    log('TAMAMLANDI');
    if(data.output_url){
      const r=document.getElementById('result') || document.createElement('div');
      r.id='result';
      const full = data.output_url.startsWith('http') ? data.output_url : api + data.output_url;
      r.innerHTML='<a href="'+full+'" target="_blank">İndir: '+full+'</a>';
      if(!document.getElementById('result')) document.querySelector('.card:last-child').appendChild(r);
    }
  } catch(e){ log('Hata: '+e); }
}
</script>
</body>
</html>
